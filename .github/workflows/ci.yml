name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Go test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: src/go.mod
          cache-dependency-path: src/go.sum

      - name: Test
        env:
          CGO_ENABLED: "0"
        run: go test ./...
